# Cheap gitleaks scan of the commits in each push, on any branch, so a secret
# pushed to a feature branch is caught before a PR is opened. The PR scan in
# ci.yml (`checks`) is still the required gate.
# Kept out of ci.yml on purpose: a push run there would add skipped `checks`
# and `e2e` runs on the same commit, and GitHub counts skipped as passing for
# required status checks.
name: Secrets scan

on:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: secrets-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  push-scan:
    name: push-scan
    # Branch deletions have no commits to scan.
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The push payload lists the pushed commits (before..after, up to 2048;
      # also correct for new branches and force pushes). Depth = count + 1
      # fetches each of them and its parent, so diffs are exact.
      - name: List pushed commits
        id: commits
        run: |
          jq -r '.commits[].id' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/commits.txt"
          n=$(wc -l < "$RUNNER_TEMP/commits.txt")
          if [ "$n" -ge 2048 ]; then
            echo "::warning::Push lists 2048 commits (payload limit); older ones are only scanned in the PR."
          fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "depth=$((n + 1))" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.commits.outputs.count != '0'
        with:
          fetch-depth: ${{ steps.commits.outputs.depth }}
          persist-credentials: false
      - name: Secrets scan (gitleaks)
        if: steps.commits.outputs.count != '0'
        run: |
          # --no-walk scans exactly the listed commits.
          # Pinned by digest (not just tag) so a compromised/republished tag can't slip a different image into CI.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --exit-code 1 --log-opts="--no-walk $(paste -sd ' ' "$RUNNER_TEMP/commits.txt")"
