name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # On a PR, HEAD is the test merge commit (parent 1: base tip, parent 2:
      # PR head), so PR-commit-count + 1 levels reach the oldest PR commit
      # without fetching the whole history. Computed in shell because workflow
      # expressions have no arithmetic.
      - name: Size the fetch
        id: pr
        run: echo "depth=$(( $(jq '.pull_request.commits // 0' "$GITHUB_EVENT_PATH") + 1 ))" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.pr.outputs.depth }}
          persist-credentials: false

      - name: Secrets scan (gitleaks)
        run: |
          # HEAD^1..HEAD^2 is exactly the PR's commits and both ends are always
          # inside the shallow fetch above.
          # Pinned by digest (not just tag) so a compromised/republished tag can't slip a different image into CI.
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --verbose --exit-code 1 --log-opts="HEAD^1..HEAD^2"

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm run check
